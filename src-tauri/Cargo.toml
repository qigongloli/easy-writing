[package]
name = "ew-client-desktop"
version = "1.0.1"
description = "易创桌面客户端"
authors = ["yilujian"]
license = "AGPL-3.0-only"
repository = "https://github.com/yilujian/easy-writing"
homepage = "https://github.com/yilujian/easy-writing"
keywords = ["writing", "novel", "ai", "local-first", "tauri"]
edition = "2021"

[lib]
name = "ew_client_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# 单实例锁：两个进程打开同一个 ew-writing.db 会在 Windows 上抢文件锁，
# 表现为本地库时开时不开。第二个实例直接把已有窗口拉到前台。
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
# 关窗兜底超时用（tauri 自带 async_runtime 即 tokio，这里显式声明以使用 tokio::time）
tokio = { version = "1", features = ["time"] }
